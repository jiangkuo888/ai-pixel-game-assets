name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s scripts -p test_export_assets.py -v
      - run: python examples/make_fixture.py --out demo-input
      - run: python scripts/export_assets.py --spec demo-input/pixel-assets.json --out demo-output
